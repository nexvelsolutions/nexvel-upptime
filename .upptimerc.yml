status-website:
  # No custom domain — using the default GitHub Pages path instead
  baseUrl: /nexvel-upptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Nexvel Solutions Client Status
  # Keep this status page out of search results
  robotsText: |
    User-agent: *
    Disallow: /
  introTitle: "**Nexvel Solutions** client website uptime monitor and status page."
  introMessage: This status page tracks the uptime of websites we manage for our clients, powered entirely by GitHub Actions, Issues, and Pages.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

